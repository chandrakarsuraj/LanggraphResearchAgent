authors = [
    { name = "chandrakarsuraj", email = "sun003light@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-tavily>=0.2.18",
